name: build-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Compile application
        if: matrix.os != 'ubuntu-latest'
        run: wails build

      - name: Compile application (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: wails build -tags webkit2_41
