name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.vars.outputs.release_version }}
    steps:
      - name: Set release version
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "release_version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_version=snapshot-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  build-artifacts:
    name: Build ${{ matrix.label }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Set release version
        shell: bash
        run: echo "RELEASE_VERSION=${{ needs.prepare-release.outputs.release_version }}" >> "$GITHUB_ENV"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Build application
        run: wails build

      - name: Archive application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Compress-Archive -Path build/bin/* -DestinationPath "release-artifacts/TemplateWorkspace_${env:RELEASE_VERSION}_${{ matrix.label }}.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.label }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs:
      - prepare-release
      - build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ needs.prepare-release.outputs.release_version }}" release-artifacts/* --title "${{ needs.prepare-release.outputs.release_version }}" --generate-notes

  snapshot-bundle:
    name: Build snapshot bundle
    if: github.event_name == 'workflow_dispatch'
    needs:
      - prepare-release
      - build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Upload combined snapshot artifacts
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-release
          path: release-artifacts/*
          if-no-files-found: error
